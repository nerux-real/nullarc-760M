name: Build kexts
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: MacKernelSDK
        run: git clone --depth 1 https://github.com/acidanthera/MacKernelSDK "$RUNNER_TEMP/MacKernelSDK"
      - name: Build PhxAccel
        run: sh src/phxaccel/build.sh "$RUNNER_TEMP/MacKernelSDK"
      - name: Build PhxBringup
        run: sh src/phxbringup/build.sh "$RUNNER_TEMP/MacKernelSDK"
      - name: Package
        run: |
          mkdir out
          ditto -c -k --keepParent src/phxaccel/build/PhxAccel.kext out/PhxAccel.kext.zip
          ditto -c -k --keepParent src/phxbringup/build/PhxBringup.kext out/PhxBringup.kext.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kexts
          path: out/*.zip
