name: build-bluetooth
# MediaTek MT7925 Bluetooth: MtkBt (firmware loader) + LegionBtFix (bluetoothd patches, macOS 26.7.1 25G241 only)
on:
  workflow_dispatch:
  push:
    paths: ['extras/**', '.github/workflows/build-bt.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build MtkBt
        working-directory: extras/mtkbt
        run: tools/build-mac.sh 2>&1 | tee ../../mtkbt-build.log; exit ${PIPESTATUS[0]}
      - name: Build LegionBtFix (against Lilu 1.7.3, the version in the EFI)
        working-directory: extras/legionbtfix
        run: |
          git clone -q --depth 1 --branch 1.7.3 https://github.com/acidanthera/Lilu Lilu
          tools/build-mac.sh 2>&1 | tee ../../legionbtfix-build.log; exit ${PIPESTATUS[0]}
      - name: Collect
        run: |
          mkdir -p bt
          cp -R extras/mtkbt/out/MtkBt.kext bt/
          cp -R extras/legionbtfix/out/LegionBtFix.kext bt/
          cp -R extras/mtkbt/LICENSE extras/mtkbt/NOTICE.md extras/mtkbt/LICENSES bt/
      - uses: actions/upload-artifact@v4
        with:
          name: bluetooth
          path: bt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: '*.log'
      - name: Publish logs to branch ci-logs
        if: always()
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p /tmp/l && cp ./*.log /tmp/l/ 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/l/*.log . 2>/dev/null || echo "no logs" > none.txt
          git add -A && git commit -qm "build logs" && git push -qf origin ci-logs
